<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>모임 목록 — MeetHub</title>
  <meta name="description" content="다양한 취미 모임을 찾아보세요. 카테고리와 지역으로 원하는 모임을 쉽게 검색할 수 있습니다.">
  <link rel="stylesheet" href="/css/app.css">
</head>
<body>

  <div th:replace="~{fragments/header :: header}"></div>

  <main>
    <!-- ==================== PAGE HEADER ==================== -->
    <section class="page-header">
      <div class="container">
        <h1>모임 목록</h1>
        <p>관심 있는 취미 모임을 찾아 참여해 보세요.</p>
      </div>
    </section>

    <!-- ==================== FILTER BAR ==================== -->
    <section class="section" style="padding-top:var(--sp-6);padding-bottom:0;" aria-label="필터">
      <div class="container">
        <div class="filter-bar">
          <div class="form-group">
            <label class="form-label" for="filter-category">카테고리</label>
            <select id="filter-category" class="form-select">
              <option value="">전체</option>
              <!-- TH:REPEAT(categories) -->
              <option value="outdoor">아웃도어</option>
              <option value="sports">스포츠</option>
              <option value="music">음악</option>
              <option value="art">미술/공예</option>
              <option value="cooking">요리</option>
              <option value="reading">독서</option>
              <option value="tech">테크/개발</option>
              <option value="language">외국어</option>
            </select>
          </div>
          <div class="form-group">
            <label class="form-label" for="filter-region">지역</label>
            <select id="filter-region" class="form-select">
              <option value="">전체</option>
              <!-- TH:REPEAT(regions) -->
              <option value="seoul">서울</option>
              <option value="gyeonggi">경기</option>
              <option value="busan">부산</option>
              <option value="daegu">대구</option>
              <option value="incheon">인천</option>
              <option value="daejeon">대전</option>
              <option value="gwangju">광주</option>
              <option value="jeju">제주</option>
            </select>
          </div>
          <button type="button" class="btn btn--primary">검색</button>
        </div>
      </div>
    </section>

    <!-- ==================== CARD GRID ==================== -->
    <section class="section" aria-label="모임 카드 목록">
      <div class="container">
        <!-- TH:REPEAT(meetings) -->
        <div class="grid grid--3">

          <!-- Card 1 -->
         <article class="card" th:each="meeting : ${meetings}">
         <div class="card-body">
         <div class="flex flex--between gap-2">
         <span class="badge badge--new">신규</span>
         <span class="text-sm text-tertiary" th:text="${meeting.category}">카테고리</span>
         </div>

         <h3 class="card-title">
         <a th:href="@{/meeting/{id}(id=${meeting.id})}"
         th:text="${meeting.title}">제목</a>
         </h3>

        <p class="card-desc" th:text="${meeting.content}">내용</p>

       <div class="card-meta">
      <span class="card-meta-item" th:text="${meeting.region}">지역</span>
      <span class="card-meta-item" th:text="${meeting.meetingStart}">시작일시</span>
      <span class="card-meta-item" th:text="${meeting.capacity} + '명'">인원</span>
        </div>
      </div>
    </article>
             
        </div>
        <!-- TH:REPEAT END -->

        <!-- ==================== PAGINATION ==================== -->
        <nav class="pagination" aria-label="페이지 네비게이션">
          <!-- TH:IF(hasPrev) -->
          <a href="#" class="is-disabled" aria-label="이전 페이지" aria-disabled="true">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><polyline points="15 18 9 12 15 6"/></svg>
          </a>
          <!-- TH:REPEAT(pages) -->
          <a href="#" class="is-active" aria-current="page">1</a>
          <a href="#">2</a>
          <a href="#">3</a>
          <a href="#">4</a>
          <span>...</span>
          <a href="#">12</a>
          <!-- TH:IF(hasNext) -->
          <a href="#" aria-label="다음 페이지">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><polyline points="9 18 15 12 9 6"/></svg>
          </a>
        </nav>

      </div>
    </section>
  </main>

  <!-- ==================== FOOTER (PARTIAL:footer START) ==================== -->
  <!-- TH:REPLACE(~{_partials/footer :: footer}) -->
  <footer class="site-footer" role="contentinfo">
    <div class="container">
      <div class="footer-inner">
        <div class="footer-brand">
          <a href="/home.html" class="site-logo" aria-label="MeetHub 홈으로">
            <svg viewBox="0 0 28 28" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><circle cx="14" cy="14" r="13" stroke="currentColor" stroke-width="2"/><circle cx="10" cy="12" r="2.5" fill="currentColor"/><circle cx="18" cy="12" r="2.5" fill="currentColor"/><path d="M9 18c0 0 2.5 3 5 3s5-3 5-3" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
            MeetHub
          </a>
          <p>취미 모임을 쉽고 빠르게. 함께하는 즐거움을 MeetHub에서 시작하세요.</p>
        </div>
        <div class="footer-links">
          <div class="footer-links-group">
            <h4>서비스</h4>
            <a href="/list.html">모임 목록</a>
            <a href="/form.html">모임 등록</a>
            <a href="#">이용 가이드</a>
          </div>
          <div class="footer-links-group">
            <h4>지원</h4>
            <a href="#">자주 묻는 질문</a>
            <a href="#">문의하기</a>
            <a href="#">이용약��</a>
            <a href="#">개인정보처리방침</a>
          </div>
        </div>
      </div>
      <div class="footer-bottom">&copy; 2026 MeetHub. All rights reserved.</div>
    </div>
  </footer>
  <!-- PARTIAL:footer END -->

  <script src="/static/js/app.js"></script>
</body>
</html>
